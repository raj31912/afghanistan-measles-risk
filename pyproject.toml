[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afghanistan-measles-reproducibility"
version = "1.0.0"
description = "Audited reproducibility pipeline for the revised Afghanistan measles Vaccine manuscript"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: full stochastic regression tests"]
